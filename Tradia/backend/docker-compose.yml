version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:tradia1234@postgres:5432/tradia_db
      - REDIS_URL=redis://redis:6379
      - STORAGE_TYPE=local
      - UPLOAD_DIR=./uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "6g"
    #     reservations:
    #       memory: "5g"

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=tradia_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tradia1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.1"
    #       memory: "1g"
    #     reservations:
    #       memory: "512m"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.1"
    #       memory: "1g"
    #     reservations:
    #       memory: "512m"

  frontend:
    build:
      context: ../../../TradiaonlyFrontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - app
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "1g"
    #     reservations:
    #       memory: "512m"

  # celery:
  #   build: .
  #   command: celery -A tasks.background_tasks worker --loglevel=info
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:tradia1234@postgres:5432/tradia_db
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     - postgres
  #     - redis
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.1"
  #         memory: "1g"
  #       reservations:
  #         memory: "512m"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
